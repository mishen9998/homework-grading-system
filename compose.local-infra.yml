name: homework-local-infra
services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.4}
    container_name: homework-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in deploy.env}
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant_local_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_local_data:
